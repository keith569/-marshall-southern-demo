<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darkroom Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&family=Lora:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: workspace shell. Header on top, tool rail left, canvas stage center, inspector right.
   Dark-first, like a darkroom. The amber accent is the safelight. */
:root {
  --bg: #14161a;
  --panel: #1b1e24;
  --panel-2: #23272f;
  --line: #2f343d;
  --fg: #e7e9ed;
  --muted: #8d95a2;
  --accent: #f2a541;
  --accent-ink: #1b1206;
  --stage: #0e1013;
  --check-a: #3b4049;
  --check-b: #30343c;
  --danger: #e5604f;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8e6e2; --panel: #f5f4f1; --panel-2: #e5e3de; --line: #cbc8c1;
    --fg: #1d2024; --muted: #5d636c; --accent: #b25d06; --accent-ink: #ffffff;
    --stage: #d3d0ca; --check-a: #ffffff; --check-b: #d6d6d6; --danger: #b8392a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e8e6e2; --panel: #f5f4f1; --panel-2: #e5e3de; --line: #cbc8c1;
  --fg: #1d2024; --muted: #5d636c; --accent: #b25d06; --accent-ink: #ffffff;
  --stage: #d3d0ca; --check-a: #ffffff; --check-b: #d6d6d6; --danger: #b8392a;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 300px;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "rail opts side" "rail stage side" "rail status side";
  gap: 8px;
  min-width: 0;
}
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 4px 2px; min-width: 0; }
.rail { grid-area: rail; }
.opts { grid-area: opts; }
.stagewrap { grid-area: stage; }
.status { grid-area: status; }
.side { grid-area: side; }

.brand { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.word { font-family: var(--font-display); font-size: 24px; line-height: 1; letter-spacing: .01em; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.btn {
  height: 30px; padding: 0 12px; border-radius: 4px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: absolute; z-index: 20; top: 34px; left: 0; min-width: 190px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px;
  display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.menu-pop button { text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 4px; }
.menu-pop button:hover { background: var(--panel-2); }

.rail {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0;
}
.tool {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: none; border: 1px solid transparent; border-radius: 4px; color: var(--muted);
}
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { color: var(--fg); background: var(--panel-2); }
.tool[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }

.opts {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 6px 12px; min-height: 42px; min-width: 0;
}
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.ctl output { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); min-width: 3.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { width: 110px; }
.ctl select, .field select, .field input[type="text"], .field input[type="number"] {
  height: 26px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--fg);
}
.hint { color: var(--muted); font-size: 12px; }
input[type="range"] { accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); }

.stagewrap {
  position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-height: 240px; min-width: 0;
}
#view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#textInput {
  position: absolute; margin: 0; padding: 0; min-width: 40px; border: 1px dashed var(--accent); outline: none; resize: none;
  background: transparent; line-height: 1.2; overflow: hidden; white-space: pre; z-index: 5; transform-origin: 0 0;
}
.dropnote {
  position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 8px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--stage) 80%, transparent); color: var(--accent); font-size: 16px; font-weight: 600; z-index: 6; pointer-events: none;
}

.status {
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; color: var(--muted); font-size: 12px; padding: 0 2px; min-width: 0;
}
.status .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); font-variant-numeric: tabular-nums; }
.status .zoom { margin-left: auto; display: flex; gap: 6px; align-items: center; }

.side {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.side h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
}
.side section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.side section:last-child { border-bottom: 0; }
.scroll { flex: 1 1 auto; min-height: 120px; overflow: auto; }
.colors { display: flex; align-items: center; gap: 10px; }
.swatches { position: relative; width: 52px; height: 40px; }
.swatches input[type="color"] { position: absolute; width: 30px; height: 30px; padding: 0; border: 2px solid var(--panel); border-radius: 4px; background: none; cursor: pointer; }
#fgIn { left: 0; top: 0; z-index: 2; }
#bgIn { left: 20px; top: 10px; }
.colors .btn { padding: 0 8px; }

.adj { display: grid; grid-template-columns: 78px minmax(0, 1fr) 40px; align-items: center; gap: 6px 8px; }
.adj label { color: var(--fg); font-size: 12px; }
.adj output { font-family: var(--font-mono); font-size: 11.5px; text-align: right; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.adj output.on { color: var(--accent); }
.adj input[type="range"] { width: 100%; min-width: 0; }
.row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

.layers { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
.lprops { display: grid; grid-template-columns: 1fr; gap: 6px; }
.lprops .ctl { justify-content: space-between; }
.lprops .ctl input[type="range"] { flex: 1; min-width: 0; }
.lprops select { flex: 1; min-width: 0; }
#layerList { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow: auto; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.layer { display: flex; align-items: center; gap: 8px; padding: 4px 6px; cursor: pointer; border-left: 3px solid transparent; }
.layer.active { background: var(--panel-2); border-left-color: var(--accent); }
.layer .eye { width: 22px; height: 22px; background: none; border: 0; color: var(--muted); display: grid; place-items: center; padding: 0; }
.layer .eye[aria-pressed="true"] { color: var(--fg); }
.layer .eye svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.layer canvas.th { width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 2px; background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 8px 8px; flex: none; }
.layer .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer input.rn { flex: 1; min-width: 0; height: 22px; background: var(--panel); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(8, 9, 11, .6); padding: 16px; }
.modal .card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow: auto; }
.modal h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; }
.field input[type="number"], .field input[type="text"], .field select { width: 100%; min-width: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.mrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; max-width: calc(100vw - 32px);
}

@media (max-width: 860px) {
  html, body { height: auto; min-height: 100%; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "rail" "opts" "stage" "status" "side"; }
  .rail { flex-direction: row; overflow-x: auto; justify-content: flex-start; padding: 4px 6px; }
  .tool { flex: none; }
  .stagewrap { height: min(62vh, 560px); }
  .scroll { overflow: visible; }
  #layerList { max-height: 220px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v9l6.4 6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <span class="word">Darkroom</span>
    </div>
    <div class="group">
      <button class="btn" id="btnOpen" type="button">Open</button>
      <button class="btn" id="btnPlace" type="button">Add as layer</button>
      <button class="btn" id="btnNew" type="button">New</button>
      <details class="menu" id="imgMenu">
        <summary class="btn">Image</summary>
        <div class="menu-pop" role="menu">
          <button type="button" data-act="rotcw">Rotate 90° clockwise</button>
          <button type="button" data-act="rotccw">Rotate 90° counter-clockwise</button>
          <button type="button" data-act="fliph">Flip horizontal</button>
          <button type="button" data-act="flipv">Flip vertical</button>
          <button type="button" data-act="resize">Resize image…</button>
          <button type="button" data-act="fit">Fit on screen</button>
        </div>
      </details>
    </div>
    <div class="group">
      <button class="btn" id="btnUndo" type="button" disabled>Undo</button>
      <button class="btn" id="btnRedo" type="button" disabled>Redo</button>
    </div>
    <div class="group" style="margin-left:auto">
      <button class="btn primary" id="btnExport" type="button">Export</button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <div class="opts" id="opts" aria-label="Tool options"></div>

  <div class="stagewrap" id="stage">
    <canvas id="view" aria-label="Editing canvas"></canvas>
    <textarea id="textInput" hidden spellcheck="false" aria-label="Text to add"></textarea>
    <div class="dropnote" id="dropnote" hidden>Drop an image to open it</div>
  </div>

  <div class="status" id="status">
    <span id="stInfo" class="mono"></span>
    <span id="stPos" class="mono"></span>
    <span id="stHint"></span>
    <span class="zoom">
      <button class="btn sm" id="zOut" type="button" aria-label="Zoom out">−</button>
      <span class="mono" id="zLabel">100%</span>
      <button class="btn sm" id="zIn" type="button" aria-label="Zoom in">+</button>
      <button class="btn sm" id="zFit" type="button">Fit</button>
      <button class="btn sm" id="z100" type="button">100%</button>
    </span>
  </div>

  <aside class="side" aria-label="Inspector">
    <section class="colors">
      <div class="swatches">
        <input type="color" id="bgIn" value="#ffffff" aria-label="Secondary color">
        <input type="color" id="fgIn" value="#e2483d" aria-label="Primary color">
      </div>
      <button class="btn sm" id="swapC" type="button" title="Swap colors (X)">Swap</button>
      <button class="btn sm" id="resetC" type="button" title="Default colors (D)">Reset</button>
    </section>
    <div class="scroll">
      <section>
        <h2>Adjust active layer</h2>
        <div class="adj" id="adj"></div>
        <div class="row">
          <button class="btn sm primary" id="adjApply" type="button">Apply</button>
          <button class="btn sm" id="adjReset" type="button">Reset sliders</button>
        </div>
      </section>
      <section>
        <h2>One-click filters</h2>
        <div class="filters" id="filters"></div>
      </section>
    </div>
    <section class="layers">
      <h2>Layers</h2>
      <div class="lprops">
        <label class="ctl">Blend <select id="blend"></select></label>
        <label class="ctl">Opacity <input type="range" id="lopacity" min="0" max="100" value="100"><output id="lopOut">100%</output></label>
      </div>
      <ul id="layerList"></ul>
      <div class="lbtns">
        <button class="btn sm" id="lNew" type="button">New</button>
        <button class="btn sm" id="lDup" type="button">Duplicate</button>
        <button class="btn sm" id="lMerge" type="button">Merge down</button>
        <button class="btn sm" id="lUp" type="button" aria-label="Move layer up">Up</button>
        <button class="btn sm" id="lDown" type="button" aria-label="Move layer down">Down</button>
        <button class="btn sm" id="lDel" type="button">Delete</button>
      </div>
    </section>
  </aside>
</div>

<input type="file" id="openInput" accept="image/*" hidden>
<input type="file" id="placeInput" accept="image/*" multiple hidden>

<div class="modal" id="mNew" hidden>
  <form class="card" id="fNew">
    <h3>New document</h3>
    <div class="presets">
      <button class="btn sm" type="button" data-w="1080" data-h="1080">Square 1080</button>
      <button class="btn sm" type="button" data-w="1920" data-h="1080">Wide 1920×1080</button>
      <button class="btn sm" type="button" data-w="1080" data-h="1350">Portrait 1080×1350</button>
      <button class="btn sm" type="button" data-w="3000" data-h="2000">Photo 3000×2000</button>
    </div>
    <label class="field">Width (px)<input type="number" id="nW" min="16" max="6000" value="1920"></label>
    <label class="field">Height (px)<input type="number" id="nH" min="16" max="6000" value="1080"></label>
    <label class="field">Background
      <select id="nBg"><option value="#ffffff">White</option><option value="#000000">Black</option><option value="transparent">Transparent</option></select>
    </label>
    <div class="mrow"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Create</button></div>
  </form>
</div>

<div class="modal" id="mResize" hidden>
  <form class="card" id="fResize">
    <h3>Resize image</h3>
    <label class="field">Width (px)<input type="number" id="rW" min="16" max="6000"></label>
    <label class="field">Height (px)<input type="number" id="rH" min="16" max="6000"></label>
    <label class="ctl"><input type="checkbox" id="rLock" checked> Keep proportions</label>
    <div class="mrow"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Resize</button></div>
  </form>
</div>

<div class="modal" id="mExport" hidden>
  <form class="card" id="fExport">
    <h3>Export</h3>
    <label class="field">File name<input type="text" id="eName" value="darkroom-image"></label>
    <label class="field">Format
      <select id="eFmt"><option value="png">PNG (lossless, keeps transparency)</option><option value="jpeg">JPEG (smaller, no transparency)</option><option value="webp">WebP (small, keeps transparency)</option></select>
    </label>
    <label class="field" id="eQRow">Quality<span class="ctl"><input type="range" id="eQ" min="40" max="100" value="92"><output id="eQOut">92%</output></span></label>
    <p class="hint" id="eInfo" style="margin:0"></p>
    <div class="mrow"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save image</button></div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const g2 = c => c.getContext('2d');
const clone = c => { const n = mk(c.width, c.height); g2(n).drawImage(c, 0, 0); return n; };
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (r, g, b) => '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  kids.forEach(k => e.append(k));
  return e;
}
let uid = 1;
const MAX_SIDE = 4000;      // longest side of an opened photo
const MAX_DOC = 6000;       // longest side of a new or resized document

/* ---------- state ---------- */
const S = {
  w: 0, h: 0, layers: [], activeId: null,
  fg: '#e2483d', bg: '#ffffff', tool: 'brush', pristine: true,
  view: { z: 1, x: 0, y: 0 }, space: false, crop: null, cursor: null, draft: null,
};
const OPT = {
  brush: { size: 28, hardness: 60, opacity: 100 },
  eraser: { size: 48, hardness: 60, opacity: 100 },
  bucket: { tol: 30 },
  shape: { kind: 'rect', fill: true, outline: false, sw: 6 },
  text: { family: 'Playfair Display', size: 72, bold: false, italic: false, outline: false },
  crop: { ratio: 'free' },
};
const active = () => S.layers.find(l => l.id === S.activeId);
function newLayer(name, canvas) {
  return { id: uid++, name, canvas: canvas || mk(S.w, S.h), visible: true, opacity: 100, blend: 'source-over', ox: 0, oy: 0, thumb: true };
}

/* ---------- rendering ---------- */
const viewEl = $('#view'), vctx = viewEl.getContext('2d');
const comp = mk(16, 16);
let compDirty = true, rafId = 0, dpr = 1, thumbTimer = 0;
let T = { stage: '#0e1013', a: '#3b4049', b: '#30343c', accent: '#f2a541' };
let checkPattern = null;

function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  T = { stage: v('--stage') || T.stage, a: v('--check-a') || T.a, b: v('--check-b') || T.b, accent: v('--accent') || T.accent };
  const p = mk(16, 16), x = g2(p);
  x.fillStyle = T.a; x.fillRect(0, 0, 16, 16);
  x.fillStyle = T.b; x.fillRect(0, 0, 8, 8); x.fillRect(8, 8, 8, 8);
  checkPattern = vctx.createPattern(p, 'repeat');
  requestRender();
}
function requestRender() { if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }

  $('#lUp').addEventListener('click', () => moveLayer(1));
  $('#lDown').addEventListener('click', () => moveLayer(-1));

  $('#zIn').addEventListener('click', () => setZoom(S.view.z * 1.25));
  $('#zOut').addEventListener('click', () => setZoom(S.view.z / 1.25));
  $('#zFit').addEventListener('click', fit);
  $('#z100').addEventListener('click', () => setZoom(1));

  const ta = $('#textInput');
  ta.addEventListener('input', positionTextEditor);
  ta.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape') { e.preventDefault(); closeTextEditor(false); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); closeTextEditor(true); }
  });
  ta.addEventListener('blur', () => closeTextEditor(true));

  const stage = $('#stage'), note = $('#dropnote');
  ['dragenter', 'dragover'].forEach(n => stage.addEventListener(n, e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); note.hidden = false; } }));
  ['dragleave', 'drop'].forEach(n => stage.addEventListener(n, e => { if (n === 'dragleave' && stage.contains(e.relatedTarget)) return; note.hidden = true; }));
  stage.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files, false); });
  window.addEventListener('paste', e => {
    if (/input|textarea|select/i.test(e.target.tagName)) return;
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
    if (files.length) { e.preventDefault(); handleFiles(files, true); }
  });

  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', e => { if (e.code === 'Space') { S.space = false; updateCursor(); } });
  new ResizeObserver(() => { sizeView(); if (!fitted) fit(); }).observe($('#stage'));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function swapColors() { const a = S.fg, b = S.bg; setColor('fg', b); setColor('bg', a); }
function onKey(e) {
  if (e.target.matches && e.target.matches('input[type="text"],input[type="number"],textarea,select')) return;
  if (!$('#mNew').hidden || !$('#mResize').hidden || !$('#mExport').hidden) { if (e.key === 'Escape') closeModals(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === '0') { e.preventDefault(); fit(); return; }
  if (mod && k === '1') { e.preventDefault(); setZoom(1); return; }
  if (mod && k === 's') { e.preventDefault(); $('#btnExport').click(); return; }
  if (mod && k === 'o') { e.preventDefault(); $('#btnOpen').click(); return; }
  if (mod) return;
  if (e.code === 'Space') { e.preventDefault(); if (!S.space) { S.space = true; updateCursor(); requestRender(); } return; }
  if (S.tool === 'crop' && S.crop) { if (e.key === 'Enter') { e.preventDefault(); cropApply(); return; } if (e.key === 'Escape') { cropCancel(); return; } }
  if (S.tool === 'move' && e.key.startsWith('Arrow')) {
    const L = active(); if (!L) return; e.preventDefault();
    const n = e.shiftKey ? 10 : 1, b = snapStruct();
    if (e.key === 'ArrowLeft') L.ox -= n; if (e.key === 'ArrowRight') L.ox += n; if (e.key === 'ArrowUp') L.oy -= n; if (e.key === 'ArrowDown') L.oy += n;
    pushHist('Move layer', [structSwap(b)]); invalidate(L); return;
  }
  if (k === '[' || k === ']') {
    const o = OPT[S.tool]; if (o && o.size) { o.size = clamp(Math.round(o.size * (k === ']' ? 1.15 : 0.87)) + (k === ']' ? 1 : -1), 1, 300); renderOpts(); requestRender(); } return;
  }
  if (k === 'x') { swapColors(); return; }
  if (k === 'd') { setColor('fg', '#000000'); setColor('bg', '#ffffff'); return; }
  const t = TOOLS.find(t => t[2] === k); if (t) selectTool(t[0]);
}

/* ---------- sample photo (so the editor opens ready to use) ---------- */
function makeSample() {
  const w = 1600, h = 1067, c = mk(w, h), x = g2(c);
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let g = x.createLinearGradient(0, 0, 0, h * .66);
  g.addColorStop(0, '#1b2a50'); g.addColorStop(.4, '#6f5a8e'); g.addColorStop(.75, '#e1906c'); g.addColorStop(1, '#f5c477');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) { x.fillStyle = `rgba(255,255,255,${.2 + rnd() * .6})`; const s = rnd() * 1.6 + .4; x.fillRect(rnd() * w, rnd() * h * .3, s, s); }
  const sg = x.createRadialGradient(w * .68, h * .56, 0, w * .68, h * .56, h * .55);
  sg.addColorStop(0, 'rgba(255,244,210,1)'); sg.addColorStop(.06, 'rgba(255,222,160,.85)'); sg.addColorStop(.35, 'rgba(255,170,100,.25)'); sg.addColorStop(1, 'rgba(255,150,90,0)');
  x.fillStyle = sg; x.fillRect(0, 0, w, h);
  const ridges = [{ base: .5, amp: 70, col: '#6a5a86' }, { base: .58, amp: 90, col: '#4a4570' }, { base: .66, amp: 80, col: '#2c2d52' }, { base: .74, amp: 55, col: '#161a33' }];
  ridges.forEach((r, k) => {
    const ph = k * 2.3; x.beginPath(); x.moveTo(0, h);
    for (let px = 0; px <= w; px += 4) {
      const y = h * r.base - (Math.sin(px * .004 + ph) * r.amp * .6 + Math.sin(px * .011 + ph * 1.7) * r.amp * .3 + Math.sin(px * .031 + ph) * r.amp * .1);
      x.lineTo(px, y);
    }
    x.lineTo(w, h); x.closePath(); x.fillStyle = r.col; x.fill();
  });
  const lake = x.createLinearGradient(0, h * .78, 0, h);
  lake.addColorStop(0, '#d9876a'); lake.addColorStop(.25, '#4a4570'); lake.addColorStop(1, '#0d1226');
  x.fillStyle = lake; x.fillRect(0, h * .78, w, h * .22);
  for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(255,224,160,${.05 + rnd() * .22})`; const yy = h * .78 + rnd() * h * .2, ww = 30 + rnd() * 160; x.fillRect(w * .68 - ww / 2 + (rnd() - .5) * 60, yy, ww, 2 + rnd() * 3); }
  const id = x.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(id, 0, 0);
  return c;
}

/* ---------- boot ---------- */
buildRail(); buildAdjust(); buildFilters(); wire(); readTheme();
setDoc(makeSample(), 'Sample photo'); lastDims = S.w + 'x' + S.h;
selectTool('brush'); renderLayers(); syncLayerProps(); updateUndoUI(); updateStatus(); sizeView(); fit();
})();
